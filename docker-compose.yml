services:
  docmost:
    image: docmost/docmost:latest
    depends_on:
      - db
      - redis
    environment:
      APP_URL: 'http://localhost:3000'
      APP_SECRET: 'REPLACE_WITH_LONG_SECRET'
      DATABASE_URL: 'postgresql://docmost:STRONG_DB_PASSWORD@db:5432/docmost'
      REDIS_URL: 'redis://redis:6379'
      # --- MinIO / S3 storage (local standalone MinIO at ../minio) ---
      STORAGE_DRIVER: 's3'
      AWS_S3_ACCESS_KEY_ID: 'minioadmin'
      AWS_S3_SECRET_ACCESS_KEY: 'minioadmin'
      AWS_S3_REGION: 'us-east-1'
      AWS_S3_BUCKET: 'docmost'
      AWS_S3_ENDPOINT: 'http://host.docker.internal:9000'
      AWS_S3_FORCE_PATH_STYLE: 'true'
      AWS_S3_URL: 'http://host.docker.internal:9000'
    # 让容器内的 host.docker.internal 解析到宿主机，从而访问宿主机上发布的 MinIO 9000 端口
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage

  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: STRONG_DB_PASSWORD
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  docmost:
  db_data:
  redis_data:
